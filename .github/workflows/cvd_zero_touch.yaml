# Standalone 1H CVD Zero-Line Touch scanner configuration.
# Symbols are loaded dynamically from Binance Spot, so the scanner can cover 400+ USDT pairs.
# Set NTFY_TOPIC as a GitHub Actions secret/environment variable for push alerts.

max_symbols: 500
minimum_symbols_required: 400
min_quote_volume_usdt: 0
exclude_symbols: []

# Pine script uses lower-timeframe intrabars. 1m bars are the closest public-API approximation.
lower_timeframe: "1m"
intrabar_lookback: 1000

# Touch is near zero, not a required cross.
# Set zero_tolerance_abs > 0 to use a fixed CVD-volume tolerance.
# If zero_tolerance_abs is 0, tolerance = avg 1m volume * percentage below.
zero_tolerance_abs: 0
zero_tolerance_pct_of_avg_1m_volume: 0.01

# A touch older than this is ignored; run on a 5-minute schedule for faster alerts.
fresh_touch_minutes: 15

workers: 8
continuous: false
poll_seconds: 300
state_file: "cvd_zero_touch_state.json"

ntfy_server: "https://ntfy.sh"
ntfy_topic_env: "NTFY_TOPIC"
ntfy_token_env: "NTFY_TOKEN"
ntfy_priority: "4"
ntfy_tags: "chart_with_upwards_trend"
