name: orderflow-choch-live

on:
  workflow_dispatch:      # آپ خود بٹن دبا کر بھی چلا سکتے ہیں
  schedule:
    - cron: "0 */6 * * *" # ہر 6 گھنٹے بعد خودکار رن ہوگا

permissions:
  contents: write         # تاکہ اسکرپٹ اپنی سٹیٹ (State) کو محفوظ کر سکے

concurrency:
  group: orderflow-choch-live
  cancel-in-progress: false # ایک وقت میں صرف ایک رن چلے گا

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # GitHub کی 6 گھنٹے کی حد سے 5 منٹ پہلے رکے گا

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        # نئے کوڈ کو ccxt کی ضرورت نہیں، aiohttp کافی ہے
        run: pip install websockets aiohttp python-dotenv

      - name: Run CHoCH + Orderflow Live
        env:
          # ⚠️ یہاں Secrets کا صحیح فارمیٹ استعمال کریں
          NTFY_URL: ***
          NTFY_TOKEN: ***
        run: |
          # نئی فائل (orderflow_choch_live.py) چلائیں
          timeout -s INT -k 120 340m python orderflow_choch_live.py || [ $? -eq 124 ]

      - name: Upload log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-log
          path: orderflow.log*
          if-no-files-found: ignore

      - name: Save state files (Commit & Push)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # ✅ درست فائل کا نام: alerts_state.json
          git add alerts_state.json || true
          
          git commit -m "auto: update state [skip ci]" || echo "No changes to commit"
          
          # سرور کے کوڈ سے ہم آہنگ ہوں
          git pull --rebase origin main || git pull --rebase || true
          
          # GitHub پر واپس بھیجیں
          git push || true
