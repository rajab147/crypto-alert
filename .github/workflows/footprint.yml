name: orderflow-paper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # ہر 6 گھنٹے بعد نیا رن

permissions:
  contents: write

concurrency:
  group: orderflow-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install websockets aiohttp python-dotenv

      - name: Run paper trader
        env:
          NTFY_URL: ${{ secrets.NFTY_OF_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          # 340 منٹ بعد SIGINT بھیجتا ہے تاکہ اسکرپٹ پوزیشنز بند کر کے state محفوظ کرے
          timeout -s INT -k 120 340m python orderflow_paper.py || [ $? -eq 124 ]

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-log
          path: orderflow.log*
          if-no-files-found: ignore

      - name: Save state files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add paper_state.json paper_trades.jsonl || true
          git commit -m "update paper state" || echo "no changes"
          git pull --rebase || true
          git push || true
