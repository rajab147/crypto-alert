name: footprint

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Run scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
          NFTY_OF_URL: ${{ secrets.NFTY_OF_URL }}
        run: python "CVD_ZeroLine_Original_OrderFlow_4H (1).py"

      - name: Save state files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.json || true
          git commit -m "update state" || echo "no changes"
          git push || true
