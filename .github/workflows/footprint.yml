name: orderflow-alerts

on:
  workflow_dispatch:      # آپ خود بٹن دبا کر بھی چلا سکتے ہیں
  schedule:
    - cron: "0 */6 * * *" # ہر 6 گھنٹے بعد خودکار رن ہوگا

permissions:
  contents: write         # تاکہ اسکرپٹ اپنی سٹیٹ (State) کو محفوظ کر سکے

concurrency:
  group: orderflow-alerts
  cancel-in-progress: false # ایک وقت میں صرف ایک رن چلے گا

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub کی 6 گھنٹے (360 منٹ) کی حد سے 5 منٹ پہلے رکے گا

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install websockets aiohttp python-dotenv

      - name: Run Orderflow Alert Script
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # اگر آپ کو US IP بلاک کا سامنا ہو تو یہ ان ویر ایبلز ان-کممنٹ کر دیں:
          # BINANCE_REST_BASE: "https://api.binance.com"
          # BINANCE_WS_BASE: "wss://stream.binance.com:9443/stream"
        run: |
          # 340 منٹ بعد SIGINT بھیجے گا تاکہ اسکرپٹ صاف ستھرا بند (graceful shutdown) ہو سکے
          # اگر timeout (exit code 124) آئے تو ورک فلو fail نہیں ہوگا
          timeout -s INT -k 120 340m python orderflow_alerts_1h4h_balanced.py
          exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Script ran for 340 minutes and was stopped gracefully."
            exit 0
          else
            exit $exit_code
          fi

      - name: Upload log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-log
          path: |
            orderflow.log
            orderflow.log.*
          if-no-files-found: ignore

      - name: Save state files (Commit & Push)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # درست فائل کا نام: alerts_state.json (Python کوڈ کے مطابق)
          git add alerts_state.json || true
          
          git commit -m "auto: update alert state [skip ci]" || echo "No changes to commit"
          
          # سرور کے کوڈ سے ہم آہنگ ہوں (اگر کوئی اور تبدیلی آئی ہو)
          git pull --rebase origin main || git pull --rebase || true
          
          # GitHub پر واپس بھیجیں
          git push origin main || true
