name: Live Signal Scanner

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: live-signal-scanner
  cancel-in-progress: false

jobs:
  scan_market:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            signal_state.json
            orderflow_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Run Scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
          NFTY_OF_URL: ${{ secrets.NFTY_OF_URL }}
        run: python live_signal_scanner.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            signal_state.json
            orderflow_state.json
          key: scanner-state-${{ github.run_id }}
