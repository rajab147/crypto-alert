name: Spot + Futures Order Flow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: orderflow
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy

      # state فائلیں رنز کے درمیان محفوظ رکھنے کے لیے (key اور path نہ بدلیں، ورنہ ٹریکر کی ہسٹری مٹ جائے گی)
      - uses: actions/cache@v4
        with:
          path: |
            flow_state.json.gz
            orderflow_state.json
            trades_state.json
          key: of-state-${{ github.run_id }}
          restore-keys: of-state-

      - name: Run scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
          NFTY_OF_URL: ${{ secrets.NFTY_OF_URL }}
        
  run: python "OrderFlow_Scanner_Tracker (1).py"
