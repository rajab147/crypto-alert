name: Spot + Futures Order Flow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: orderflow
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16          # ← 10 سے 16 (تاکہ ٹائم آؤٹ کا مسئلہ نہ ہو)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"           # ← pip کیچ آن کر دی ہے

      - name: Install dependencies
        run: pip install requests numpy   # ← --no-cache-dir ہٹا دیا تاکہ کیچ کام کرے

      # state فائلیں رنز کے درمیان محفوظ رکھنے کے لیے
      - uses: actions/cache@v4
        id: state-cache
        with:
          path: |
            flow_state.json.gz
            orderflow_state.json
            trades_state.json
          key: of-state-${{ github.run_id }}
          restore-keys: |
            of-state-

      - name: Run scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
          NFTY_OF_URL: ${{ secrets.NFTY_OF_URL }}
        run: python orderflow_spot_futures.py

      # اگر رن کامیاب ہوا تو state کو فوراً نئی key سے محفوظ کرو
      - name: Save state snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            flow_state.json.gz
            orderflow_state.json
            trades_state.json
          key: of-state-${{ github.run_id }}-saved
