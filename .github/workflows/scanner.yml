name: OrderFlow Scanner + Tracker

on:
  schedule:
    - cron: "*/15 * * * *"      # ہر 15 منٹ (سکینر کی SCAN_MINUTES کے مطابق)
  workflow_dispatch:

concurrency:
  group: orderflow
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install requests numpy pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # پچھلی state فائلیں بحال کریں (سب سے نئی کیش)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            signal_state.json
            orderflow_state.json
            trades_state.json
          key: of-state-${{ github.run_id }}
          restore-keys: |
            of-state-

      - name: Run scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
          NFTY_OF_URL: ${{ secrets.NFTY_OF_URL }}
        run: python OrderFlow_Scanner_Tracker-2.py

      # رن ناکام بھی ہو تو state محفوظ کریں تاکہ کھلی ٹریڈز ضائع نہ ہوں
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            signal_state.json
            orderflow_state.json
            trades_state.json
          key: of-state-${{ github.run_id }}
          
