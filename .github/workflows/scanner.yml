name: CVD Scanner

on:
  schedule:
    # ہر 15 منٹ پر (منٹ 1،16،31،46 — عین :00/:15 پر GitHub بہت مصروف ہوتا ہے)
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:

# ایک وقت میں ایک ہی رن؛ پچھلا چل رہا ہو تو نیا انتظار کرے (state فائل ٹکرائے نہیں)
concurrency:
  group: cvd-scanner
  cancel-in-progress: false

permissions:
  contents: write   # state فائل واپس commit کرنے کے لیے

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests numpy

      - name: Run CVD scanner
        env:
          NFTY_URL: ${{ secrets.NFTY_URL }}
        run: python CVD_Scanner_V5.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cvd_zero_touch_state.json || true
          if git diff --cached --quiet; then
            echo "state میں کوئی تبدیلی نہیں"
          else
            git commit -m "update CVD state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "push نہیں ہو سکا؛ اگلے رن میں دوبارہ کوشش ہوگی"
          fi
          
