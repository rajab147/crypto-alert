name: Binance Liquidity Sweep Scanner

on:
  schedule:
    # یہ ہر 6 گھنٹے بعد خود بخود اسکرپٹ کو شروع کرے گا
    - cron: '0 */6 * * *'
  workflow_dispatch: # تاکہ آپ خود بھی مینوئل چلا سکیں

jobs:
  scan_market:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 گھنٹے کا ٹائم آؤٹ

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy

    - name: Run Live Scanner
      run: python live_scanner.py
