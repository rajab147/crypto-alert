name: Binance Liquidity Sweep Scanner

on:
  schedule:
    # ہر 30 منٹ بعد اسکرپٹ چلے گا (500 کوئنز کے لیے یہ بہتر ہے)
    - cron: '*/30 * * * *'
  workflow_dispatch: 

# یہ یقینی بنائے گا کہ ایک وقت میں صرف ایک ہی اسکین چلے
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_market:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 25 منٹ کا ٹائم آؤٹ

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy

    - name: Run Live Scanner
      run: python live_signal_scanner.py --once
